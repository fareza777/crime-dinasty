name: vice_dynasty
description: "Vice Dynasty: Crime Life Simulator — a neo-noir multi-generation crime dynasty life sim."
publish_to: "none"
version: 1.9.11+24

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.1
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/events/
    - assets/sfx/
    - assets/music/
    - assets/vo/
    - assets/images/
    - assets/images/title_poster.png
    - assets/images/events/
    - assets/images/districts/
    - assets/images/crests/
    - assets/images/chrome/
    - assets/images/portraits/
    - assets/images/headers/
    - assets/images/activities/
    - assets/images/fronts/
    - assets/icons/
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
        - asset: assets/fonts/Cinzel-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
